<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<link rel='preconnect' href='https://fonts.googleapis.com'>
<link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
<link href='https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,700..900,100&family=DM+Serif+Display&family=Young+Serif&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap' rel='stylesheet'>
<style>
  body { background: white; font-size: 28px; padding: 30px; line-height: 1.2; }
  .box { margin-bottom: 30px; border-bottom: 1px solid #ccc; padding-bottom: 20px; }
  .label { font-family: sans-serif; font-size: 14px; color: #888; margin-bottom: 8px; }
  .f-fraunces { font-family: 'Fraunces', serif; font-weight: 800; }
  .f-dm { font-family: 'DM Serif Display', serif; }
  .f-young { font-family: 'Young Serif', serif; }
  .teal { color: #00897b; }
</style>
</head>
<body>
  <div class='box'>
    <div class='label'>Fraunces 800 Soft 100</div>
    <div class='f-fraunces'>Seu sorriso na<br><span class='teal'>melhor direção</span></div>
    <div class='f-fraunces' style='font-size:24px; margin-top:8px;'>Nossos Serviços</div>
  </div>
  <div class='box'>
    <div class='label'>DM Serif Display</div>
    <div class='f-dm'>Seu sorriso na<br><span class='teal'>melhor direção</span></div>
    <div class='f-dm' style='font-size:24px; margin-top:8px;'>Nossos Serviços</div>
  </div>
  <div class='box'>
    <div class='label'>Young Serif</div>
    <div class='f-young'>Seu sorriso na<br><span class='teal'>melhor direção</span></div>
    <div class='f-young' style='font-size:24px; margin-top:8px;'>Nossos Serviços</div>
  </div>
</body>
</html>
